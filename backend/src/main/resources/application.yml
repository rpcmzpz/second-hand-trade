server:
  port: 8080

springdoc:
  swagger-ui:
    path: /docs
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/second_hand_trade?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: campus-trade-secret-key-2024-very-long-secret-key-for-jwt-token-generation
  expiration: 86400000

file:
  upload-path: uploads

deepseek:
  api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
  base-url: https://api.deepseek.com/v1
  model: deepseek-chat
